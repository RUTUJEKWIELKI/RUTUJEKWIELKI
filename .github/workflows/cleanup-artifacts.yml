# Automatically delete old GitHub Actions artifacts to reduce storage usage.
name: Cleanup old Actions artifacts

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-old-actions-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    # Preserve the profile repository exclusion.
    if: github.repository != 'RUTUJEKWIELKI/RUTUJEKWIELKI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete artifacts older than 14 days
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          KEEP_DAYS: '14'
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${KEEP_DAYS} days ago" +'%Y-%m-%dT%H:%M:%SZ')
          artifact_ids=$(mktemp)
          trap 'rm -f "${artifact_ids}"' EXIT

          # Fetch all pages before deletion to avoid skipping shifted pages.
          gh api --paginate "repos/${REPOSITORY}/actions/artifacts?per_page=100" |
            jq -r --arg cutoff "${cutoff}" '.artifacts[]? | select(.created_at < $cutoff) | .id' > "${artifact_ids}"

          removed=0
          while IFS= read -r artifact_id; do
            [[ -n "${artifact_id}" ]] || continue
            gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
            ((removed+=1))
          done < "${artifact_ids}"

          echo "Deleted ${removed} artifact(s) older than ${KEEP_DAYS} days."
